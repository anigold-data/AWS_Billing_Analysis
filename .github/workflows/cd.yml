name: CD - Export Model Documentation

on:
  push:
    branches: [main]

jobs:
  export-docs:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Tabular Editor CLI
        run: |
          Invoke-WebRequest -Uri "https://github.com/TabularEditor/TabularEditor/releases/latest/download/TabularEditor.Portable.zip" -OutFile "TE.zip"
          Expand-Archive -Path "TE.zip" -DestinationPath "TE"

      - name: Export model metadata
        run: |
          .\TE\TabularEditor.exe "model/AWS_Billing_Analysis.SemanticModel" -M "docs/model-metadata.json"

      - name: Commit updated documentation
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/model-metadata.json
          git commit -m "Auto-update model metadata [skip ci]" || echo "No changes to commit"
          git push